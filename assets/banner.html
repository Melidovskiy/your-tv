<!doctype html>
<!-- README banners and link preview, rendered by tools/banner.sh:
     ?lang=en / ?lang=ru at 1280×520, ?kind=social at 1280×640. -->
<html>
<head>
<meta charset="utf-8">
<title>your-tv banner</title>
<style>
  @font-face { font-family: 'Inter'; src: url('../app/assets/fonts/InterVariable.ttf'); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 520px; overflow: hidden; }
  body.social { height: 640px; }
  body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background: #1d211c; position: relative; color: #fff; }

  /* Background: the same wallpaper, blurred and darkened, so the banner takes its colours from the photo. */
  .bg { position: absolute; inset: -60px; background: url('home-en.png') center / cover; filter: blur(38px) brightness(.55) saturate(1.15); }
  .ru .bg { background-image: url('home-ru.png'); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,12,10,.55) 0%, rgba(10,12,10,.15) 55%, rgba(10,12,10,0) 100%); }

  /* The real home screen as a screen: rounded corners, a thin edge and a soft shadow. */
  .shot { position: absolute; right: 64px; top: 50%; width: 704px; aspect-ratio: 16 / 9; transform: translateY(-50%);
          border-radius: 14px; background: url('home-en.png') center / cover;
          box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 28px 60px rgba(0,0,0,.45), 0 6px 16px rgba(0,0,0,.3); }
  .ru .shot { background-image: url('home-ru.png'); }
  .social .shot { width: 780px; right: 56px; }

  .text { position: absolute; left: 72px; top: 50%; transform: translateY(-50%); width: 400px; }
  .social .text { width: 360px; left: 60px; }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
  .text p { margin-top: 18px; font-size: 22px; line-height: 1.4; font-weight: 500; color: rgba(255,255,255,.86); }
</style>
</head>
<body>
  <div class="bg"></div><div class="shade"></div>
  <div class="text">
    <h1>your-tv</h1>
    <p data-en="A home screen for Android TV without ads: photo wallpapers, the weather and a VPN to your own server."
       data-ru="Главный экран для Android TV без рекламы: фотообои, погода и VPN через свой сервер."></p>
  </div>
  <div class="shot"></div>
<script>
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'ru' ? 'ru' : 'en';
  if (lang === 'ru') document.body.classList.add('ru');
  if (q.get('kind') === 'social') document.body.classList.add('social');
  document.documentElement.lang = lang;
  const p = document.querySelector('.text p');
  p.textContent = p.dataset[lang];
</script>
</body>
</html>

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Libraries (checked by sha256)
        run: tools/fetch_libs.sh
      - name: Host tests
        run: ./test.sh
      - name: Build the APK
        run: |
          ./build.sh
          ls -l FreeMyTV.apk
